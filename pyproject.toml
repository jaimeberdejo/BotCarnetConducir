[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "botcarnetconducir"
version = "0.1.0"
description = "Telegram bot para practicar el examen teorico del carnet B en Espana."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "python-telegram-bot>=21,<22",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
